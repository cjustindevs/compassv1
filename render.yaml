# ============================================================================
# COMPASS -- Render Blueprint (render.yaml)
#
# Provisioning: (1) a free managed PostgreSQL database and (2) a free Docker
# web service. Render's free tier includes ONE free PostgreSQL instance with a
# single database, which is why everything (main app + identity vault) uses it.
#
# Render Dashboard -> New -> Blueprint -> this repo/branch. Render reads this
# file, creates the DB, then asks you to fill the sync:false secret values.
# ============================================================================

databases:
  - name: compass-postgres
    plan: free
    region: singapore
    databaseName: compass
    user: compass

services:
  - type: web
    name: compass
    runtime: docker
    branch: deploy                # deployment branch (change only if you deploy elsewhere)
    region: singapore             # fall back to oregon if the Singapore region is not offered
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true

    envVars:
      - key: APP_NAME
        value: COMPASS
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: PORT
        value: "10000"

      # --- Application secrets (set in the Dashboard, not stored in Git) ---
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false

      # --- Main PostgreSQL database (Render managed `compass-postgres`) ---
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_PORT
        value: "5432"
      - key: DB_SSLMODE
        value: prefer
      - key: DB_HOST
        fromDatabase:
          name: compass-postgres
          property: host
      - key: DB_DATABASE
        fromDatabase:
          name: compass-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: compass-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: compass-postgres
          property: password

      # --- Identity vault (SAME managed Postgres -- free tier allows only ONE
      #     database. The vault's `idv_*` tables live beside the main tables;
      #     `docker/start.sh` migrates them with
      #     `--database=identity_vault --path=database/migrations/identity_vault`. ---
      - key: DB_IDENTITY_CONNECTION
        value: pgsql
      - key: DB_IDENTITY_PORT
        value: "5432"
      - key: DB_IDENTITY_HOST
        fromDatabase:
          name: compass-postgres
          property: host
      - key: DB_IDENTITY_DATABASE
        fromDatabase:
          name: compass-postgres
          property: database
      - key: DB_IDENTITY_USERNAME
        fromDatabase:
          name: compass-postgres
          property: user
      - key: DB_IDENTITY_PASSWORD
        fromDatabase:
          name: compass-postgres
          property: password
      - key: IDENTITY_VAULT_ENCRYPTION_KEY
        sync: false
      - key: IDENTITY_VAULT_RESPONDER_IDS
        sync: false

      # --- Runtime behavior ---
      - key: QUEUE_CONNECTION
        value: sync
      - key: BROADCAST_CONNECTION
        value: log
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: FILESYSTEM_DISK
        value: local
      - key: LOG_CHANNEL
        value: stderr
      # File cache (single web instance): avoids the online database cache
      # (cache/cache_locks tables + lock contention), which otherwise stalls
      # every rate-limited AJAX call (OTP, alias shuffle).
      - key: CACHE_STORE
        value: file
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: projectdialafriendorganization@gmail.com
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        value: projectdialafriendorganization@gmail.com
      # 16-char Gmail App Password — set in the Dashboard (NEVER in Git).
      # Without it Gmail rejects the login and OTP sending returns 503.
      - key: MAIL_PASSWORD
        sync: false
      - key: RUN_SCHEDULER
        value: "true"
      # Seeds the documented demo accounts on first boot only (guarded: the
      # seeder runs only while the demo accounts are still missing). With
      # MAIL_MAILER=log (or blank), OTP verification codes are DISPLAYED ON
      # SCREEN inside the register dialog instead of being emailed.
      - key: RUN_SEED_DEMO
        value: "true"
      # Testing mode: DEFAULT true. Skips duty-hour gatekeeping (verification,
      # duty shift, readiness, two-session limit, availability toggle, service
      # hours) so every feature can be tested end to end. Hard safety rules
      # (active account, active adviser, not under review, no conflict, no
      # concurrent assignment, competency/risk) always remain enforced.
      # Set to "false" when the institution wants real enforcement back.
      - key: RELAX_DUTY_HOURS
        value: "true"