# ============================================================================
# COMPASS -- Render Blueprint (render.yaml)
#
# Usage: Render Dashboard -> New -> Blueprint -> select the COMPASS repo, or
# run from the repo root in the Render Shell. Render reads this file, creates a
# Docker web service and lets you fill in the secret values marked sync: false.
#
# Region and plan reflect the free tier; Singapore is selected if available.
# ============================================================================

# ============================================================================
# COMPASS -- Render Blueprint (render.yaml)
#
# Provisions: (1) a free managed PostgreSQL database and (2) a free Docker web
# service. Render's free tier includes ONE free PostgreSQL database, which is
# why the stack is PostgreSQL (there is no free MySQL on Render).
#
# Render Dashboard -> New -> Blueprint -> this repo/branch. Render reads this
# file, creates the DB, then asks you to fill the sync:false secret values.
# ============================================================================

databases:
  - name: compass-postgres
    plan: free
    region: singapore
    databaseName: compass
    user: compass

services:
  - type: web
    name: compass
    runtime: docker
    branch: deploy                # deployment branch (change only if you deploy elsewhere)
    region: singapore             # fall back to oregon if the Singapore region is not offered
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true

    envVars:
      - key: APP_NAME
        value: COMPASS
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: PORT
        value: "10000"

      # --- Application secrets (set in the Dashboard, not stored in Git) ---
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false

      # --- Main PostgreSQL database (Render managed `compass-postgres`) ---
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_PORT
        value: "5432"
      - key: DB_HOST
        fromDatabase:
          name: compass-postgres
          property: host
      - key: DB_DATABASE
        fromDatabase:
          name: compass-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: compass-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: compass-postgres
          property: password

      # --- Isolated identity vault (second database -- auto-created on boot) ---
      - key: DB_IDENTITY_CONNECTION
        value: pgsql
      - key: DB_IDENTITY_PORT
        value: "5432"
      - key: DB_IDENTITY_HOST
        sync: false
      - key: DB_IDENTITY_DATABASE
        sync: false
      - key: DB_IDENTITY_USERNAME
        sync: false
      - key: DB_IDENTITY_PASSWORD
        sync: false
      - key: IDENTITY_VAULT_ENCRYPTION_KEY
        sync: false
      - key: IDENTITY_VAULT_RESPONDER_IDS
        sync: false

      # --- Runtime behavior ---
      - key: QUEUE_CONNECTION
        value: sync
      - key: BROADCAST_CONNECTION
        value: log
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: FILESYSTEM_DISK
        value: local
      - key: LOG_CHANNEL
        value: stderr
      - key: MAIL_MAILER
        value: log
      - key: RUN_SCHEDULER
        value: "true"